<title>Buscador de Baterías LTP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F5F1; --surface:#FFFFFF; --surface-2:#ECEEE6; --line:#DFE2D8; --line-2:#CBCFC1;
  --ink:#222420; --ink-2:#6A6C68; --ink-3:#8F918B;
  --brand:#9AAE3B; --brand-ink:#5E6C1B; --brand-soft:#F0F4DF; --brand-line:#CBD996;
  --ok:#146F45; --ok-soft:#DFF0E6;
  --warn:#8A5A00; --warn-soft:#F9EED4;
  --shadow:0 1px 2px rgba(34,32,30,.05),0 10px 26px -14px rgba(34,32,30,.22);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#141613; --surface:#1D1F1B; --surface-2:#262924; --line:#353830; --line-2:#484C41;
    --ink:#EDEFE7; --ink-2:#AEB1A6; --ink-3:#838779;
    --brand:#B6CB55; --brand-ink:#C9DC82; --brand-soft:#2A3116; --brand-line:#4E5B22;
    --ok:#63C48F; --ok-soft:#16321F;
    --warn:#D9A24A; --warn-soft:#3A2E17;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#141613; --surface:#1D1F1B; --surface-2:#262924; --line:#353830; --line-2:#484C41;
  --ink:#EDEFE7; --ink-2:#AEB1A6; --ink-3:#838779;
  --brand:#B6CB55; --brand-ink:#C9DC82; --brand-soft:#2A3116; --brand-line:#4E5B22;
  --ok:#63C48F; --ok-soft:#16321F;
  --warn:#D9A24A; --warn-soft:#3A2E17;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ===== topbar ===== */
.top{position:sticky;top:0;z-index:60;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo img{height:30px;width:auto;display:block;flex:none}
.logo .div{width:1px;height:24px;background:var(--line);flex:none}
.logo h1{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;margin:0;letter-spacing:-.01em;white-space:nowrap}
.foot{max-width:1400px;margin:0 auto;padding:26px 20px 40px;display:flex;align-items:center;gap:12px;
  color:var(--ink-3);font-size:12px;border-top:1px solid var(--line)}
.foot img{height:24px;width:auto;opacity:.8}
.searchbox{flex:1 1 auto;position:relative;min-width:0;max-width:520px}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.searchbox input{width:100%;padding:9px 13px 9px 38px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--ground);appearance:none}
.searchbox input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn-filters{display:none;margin-left:auto;padding:9px 14px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn-filters .cnt{display:inline-block;margin-left:6px;background:var(--brand);color:#fff;border-radius:99px;
  padding:0 6px;font-size:11.5px;font-weight:700}

/* ===== shell ===== */
.shell{max-width:1400px;margin:0 auto;padding:20px;display:grid;grid-template-columns:272px minmax(0,1fr);gap:20px;
  align-items:start}

/* ===== sidebar ===== */
.side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  position:sticky;top:78px;max-height:calc(100vh - 98px);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sidehead{display:none;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex:none}
.sidehead h2{font-family:"Archivo",sans-serif;font-size:15px;margin:0;font-weight:700}
.sidebody{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sidefoot{display:none;padding:12px 16px;border-top:1px solid var(--line);flex:none;background:var(--surface)}
.sidefoot button{width:100%;padding:12px;border:none;border-radius:9px;background:var(--brand);color:#fff;
  font-family:"Archivo",sans-serif;font-weight:700;font-size:15px;cursor:pointer}
.facet{border-bottom:1px solid var(--line)}
.facet:last-child{border-bottom:none}
.facet > h3{margin:0;font-family:"Archivo",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-2);padding:14px 16px 9px;display:flex;align-items:center;gap:8px}
.facet > h3 svg{color:var(--brand);flex:none}
.facet .body{padding:0 16px 14px}
.fsearch{width:100%;padding:7px 10px;border:1px solid var(--line-2);border-radius:7px;background:var(--ground);
  font-size:13px;margin-bottom:8px}
.fsearch:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.opts{display:flex;flex-direction:column;gap:1px;max-height:230px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.opt{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;
  font-size:13.5px;line-height:1.3;border:1px solid transparent;background:none;text-align:left;width:100%}
.opt:hover{background:var(--surface-2)}
.opt .box{width:16px;height:16px;border:1.6px solid var(--line-2);border-radius:4px;flex:none;display:grid;
  place-items:center;background:var(--surface)}
.opt .box svg{opacity:0;color:#fff;width:11px;height:11px}
.opt[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand-line);font-weight:600}
.opt[aria-pressed=true] .box{background:var(--brand);border-color:var(--brand)}
.opt[aria-pressed=true] .box svg{opacity:1}
.opt .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.opt .n{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.opt[aria-pressed=true] .n{color:var(--brand-ink)}
.opt:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{padding:6px 12px;border:1.5px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:baseline}
.vchip .n{font-size:11px;color:var(--ink-3);font-weight:400}
.vchip[aria-pressed=true]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.vchip:disabled{opacity:.35;cursor:default}

/* ===== main ===== */
.active{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.active .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 8px 5px 11px;border-radius:99px;
  background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);
  font-size:12.5px;font-weight:600}
.tag button{background:none;border:none;cursor:pointer;color:inherit;padding:0;line-height:1;opacity:.7;font-size:14px}
.tag button:hover{opacity:1}
.clearall{background:none;border:none;color:var(--ink-3);font-size:12.5px;cursor:pointer;text-decoration:underline}
.clearall:hover{color:var(--ink)}

.spec{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);
  border-radius:var(--r);padding:13px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;
  flex-wrap:wrap;box-shadow:var(--shadow)}
.spec .nm{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px;white-space:nowrap}
.spec .sp{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--ink-2);
  font-family:"IBM Plex Mono",monospace;align-items:baseline}
.spec .sp b{color:var(--ink-3);font-weight:400;text-transform:uppercase;font-size:10.5px;letter-spacing:.05em;
  font-family:"IBM Plex Sans",sans-serif;margin-right:5px}

.count{font-size:14px;color:var(--ink-2);margin:0 2px 12px}
.count b{font-family:"Archivo",sans-serif;font-size:17px;color:var(--ink);font-weight:700}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar select{padding:7px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:13.5px}

.list{display:flex;flex-direction:column;gap:8px}
.lhead{display:grid;grid-template-columns:var(--grid);gap:10px;align-items:center;
  padding:9px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-3);
  margin-bottom:8px}
.lhead .num{text-align:right}
:root{--grid:48px minmax(190px,1fr) 58px 84px 196px 74px 100px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;
  display:grid;grid-template-columns:var(--grid);gap:10px;align-items:center;cursor:pointer;
  text-align:left;width:100%;font:inherit;color:inherit;box-shadow:var(--shadow)}
.card:hover{border-color:var(--brand-line);background:var(--brand-soft)}
.thumb{width:48px;height:48px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:"Archivo",sans-serif;font-weight:800;font-size:11px;
  color:var(--ink-2);letter-spacing:.02em}
.card .fam{display:block;font-family:"Archivo",sans-serif;font-weight:700;font-size:14px;color:var(--brand-ink);
  line-height:1.25}
.card .mdl{display:block;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.03em;
  text-transform:uppercase;font-weight:600}
.cel{font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cel.num{text-align:right}
.card .price{font-family:"Archivo",sans-serif;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;
  white-space:nowrap;text-align:right;display:block}
.card .price.best{color:var(--ok)}
.card .nop{font-size:11.5px;color:var(--warn);font-style:italic;font-weight:500;text-align:right;display:block}
.tagline{display:inline-block;margin-top:3px;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;
  font-weight:700;padding:2px 6px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.mlabel{display:none}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);
  text-align:center;padding:52px 20px;color:var(--ink-3)}
.empty strong{display:block;font-family:"Archivo",sans-serif;font-size:16px;color:var(--ink-2);margin-bottom:5px}

/* ===== dialog ===== */
dialog{border:none;padding:0;border-radius:14px;max-width:580px;width:calc(100% - 28px);background:var(--surface);
  color:var(--ink);box-shadow:0 30px 70px -22px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(28,24,20,.55)}
.dhead{padding:18px 20px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dhead h2{font-family:"Archivo",sans-serif;font-size:15px;margin:0 0 4px;font-weight:700;color:var(--brand-ink)}
.dhead .mo{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2)}
.dclose{margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:8px;color:var(--ink-2);
  cursor:pointer;padding:5px 10px;font-size:15px;line-height:1;flex:none}
.dclose:hover{background:var(--surface-2)}
.dprice{padding:15px 20px;background:var(--surface-2);border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dprice .n{font-family:"Archivo",sans-serif;font-size:29px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.dprice .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.dprice .eq{font-size:12px;color:var(--ink-2);text-align:right;font-family:"IBM Plex Mono",monospace}
dl{margin:0;padding:16px 20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 16px;font-size:13.5px}
dt{color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-top:3px}
dd{margin:0;font-family:"IBM Plex Mono",monospace;font-size:13px;word-break:break-word}
.dfoot{padding:12px 20px 17px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}

/* ===== mobile ===== */
.scrim{display:none;position:fixed;inset:0;background:rgba(28,24,20,.5);z-index:70}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;padding:14px}
  .btn-filters{display:block}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(330px,88vw);max-height:none;z-index:80;
    border-radius:0;border:none;border-right:1px solid var(--line);transform:translateX(-102%);
    transition:transform .22s ease}
  .sidehead,.sidefoot{display:flex}
  body.drawer .side{transform:none}
  body.drawer .scrim{display:block}
  .lhead{display:none}
  .card{grid-template-columns:44px minmax(0,1fr);gap:6px 12px;align-items:start}
  .thumb{width:44px;height:44px;font-size:10px;grid-row:span 2}
  .card .cel{grid-column:2;display:flex;gap:8px;align-items:baseline;font-size:12.5px}
  .card .cel.num{text-align:left}
  .mlabel{display:inline;font-family:"IBM Plex Sans",sans-serif;font-size:10px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--ink-3);font-weight:700;min-width:74px}
  .card .pricewrap{grid-column:1/-1;border-top:1px solid var(--line);padding-top:9px;margin-top:4px;
    display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card .price,.card .nop{text-align:left}
  .spec{flex-direction:column;gap:8px}
  .topin{padding:10px 14px;gap:10px}
  .logo h1{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

,"cb":"","f":"HAWKER FLEX","m":"36FLX558_186 (207155T-SBKN)","pr":15189.0666666667,"s":"Master Hawker List","mt":"order code","mm":"36FLX558_186 (207155T-SBKN)","mo":"36FLX558_186 (207155T-SBKN)","d":"HAWKER Sealed TPPL Technologic Industrial Battery","va":"36V / 558AH","dm":"38.27 x 17.50 x 24.50","w":"1465","kw":"207155T-SBKN","wr":"3 Yrs Full","bc":"SB175 / Gray"},{"e":"ADVANCE CS7010","v":"36","cp":"","cn":"SB350 GRAY","cc":"","p":"","cb":"","f":"HAWKER FLEX","m":"36FLX558_186 (207155T-SBKN)","pr":15189.0666666667,"s":"Master Hawker List","mt":"order code","mm":"36FLX558_186 (207155T-SBKN)","mo":"36FLX558_186 (207155T-SBKN)","d":"HAWKER Sealed TPPL Technologic Industrial Battery","va":"36V / 558AH","dm":"38.27 x 17.50 x 24.50","w":"1465","kw":"207155T-SBKN","wr":"3 Yrs Full","bc":"SB175 / Gray"},{"e":"AISLE-MASTER AM33","v":"48","cp":"32 x 25.6 x 33.3","cn":"EURO 320","cc":"","p":"D","cb":"44","f":"HAWKER FLEX","m":"24-FLX700-31 (311B37P01T2-SBKN)","pr":22951.8333333333,"s":"Master Hawker List","mt":"order code","mm":"24-FLX700-31 (311B37P01T2-SBKN)","mo":"24-FLX700-31 (311B37P01T2-SBKN)","d":"HAWKER Sealed TPPL Technologic Industrial Battery","va":"48V / 700AH","dm":"32.05 X 25.55 X 33.30","w":"2563","kw":"311B37P01T2-SBKN","wr":"3 Yrs Full","bc":"SB350 / Blue"}]};</script>
<script>
(function(){
let ROWS = window.__BAT__.rows;

// Si existe datos.csv junto al index.html, usa ese archivo (permite
// actualizar precios sin tocar el HTML). Si no, usa los datos incrustados.
const CSVCOLS = ['Equipo','Voltaje','Compartimiento','Conector','CodigoComp','Posicion','Cable',
  'Familia','ModeloHoja','Precio','Listado','Criterio','ModeloListado','CodigoOrden',
  'Descripcion','VoltsAmp','Dimensiones','Peso','KWH','Garantia','ConectorBateria'];
const CSVKEYS = ['e','v','cp','cn','cc','p','cb','f','m','pr','s','mt','mm','mo','d','va','dm','w','kw','wr','bc'];
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if (c==='"') q=true;
    else if (c===','){ row.push(cell); cell=''; }
    else if (c==='\n'){ row.push(cell); cell=''; rows.push(row); row=[]; }
    else cell+=c;
  }
  if (cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==''));
}
function fromCSV(text){
  const rows=parseCSV(text); if (rows.length<2) return null;
  const head=rows[0].map(s=>s.trim());
  const idx=CSVCOLS.map(c=>head.indexOf(c));
  if (idx[0]===-1 || idx[9]===-1) return null;      // sin Equipo o Precio no sirve
  return rows.slice(1).map(r=>{
    const o={};
    CSVKEYS.forEach((k,n)=>{ const v = idx[n]===-1 ? '' : (r[idx[n]]||'').trim(); o[k]= k==='pr' ? (v===''?null:(isNaN(+v)?null:+v)) : v; });
    return o;
  }).filter(o=>o.e);
}
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
const fmt = n => n==null?null:'$'+Math.round(n).toLocaleString('en-US');

// marca de equipo: la hoja Crown 2022 es todo CROWN
ROWS.forEach(r => { r.mk = r.mk || 'CROWN'; r._ah = (()=>{ const t=r.va||'';
    let m=/(\d[\d,]*)\s*AH/i.exec(t); if(m) return +m[1].replace(/,/g,'');
    m=/\/\s*(\d[\d,]*)/.exec(t);      if(m) return +m[1].replace(/,/g,'');
    m=/^\s*(\d[\d,]*)\s*$/.exec(t);   if(m) return +m[1].replace(/,/g,'');
    return 0; })(); });

const F = { mk:new Set(), e:new Set(), v:new Set(), f:new Set(), s:new Set() };
const KEYS = ['mk','e','v','f','s'];
const LABEL = { mk:'Marca', e:'Equipo', v:'Voltaje', f:'Familia', s:'Marca batería' };
const val = (r,k) => k==='v' ? String(r.v) : (k==='s' ? brandOf(r.s) : r[k]);

function brandOf(src){
  const t = src||'';
  if (t.indexOf('GNB')>-1) return 'Stryten / GNB';
  if (t.indexOf('Hawker')>-1) return 'Hawker';
  if (t.indexOf('Coolpower')>-1) return 'Coolpower';
  if (t.indexOf('Enersys')>-1) return 'Enersys';
  if (t.indexOf('V-Force')>-1) return 'V-Force';
  return 'Sin listado';
}
function short(fam){
  const t=(fam||'').toUpperCase();
  if (t.indexOf('F100')>-1) return 'F100'; if (t.indexOf('F110')>-1) return 'F110';
  if (t.indexOf('T300')>-1) return 'T300'; if (t.indexOf('T310')>-1) return 'T310';
  if (t.indexOf('T330')>-1) return 'T330'; if (t.indexOf('AGM')>-1) return 'AGM';
  if (t.indexOf('COOLPOWER')>-1) return 'CP'; if (t.indexOf('HAWKER')>-1) return 'FLEX';
  if (t.indexOf('TUBULAR')>-1) return 'VF-T'; if (t.indexOf('V-FORCE')>-1) return 'VF';
  if (t.indexOf('ENERSYS')>-1) return 'ENS';
  return '—';
}

// pasa todos los filtros EXCEPTO el indicado (para contar facetas)
function passes(r, except){
  for (const k of KEYS){
    if (k===except) continue;
    if (F[k].size && !F[k].has(val(r,k))) return false;
  }
  const q = norm($('#q').value);
  if (q && norm(r.e+r.m+r.f+r.mm+r.mo+r.cn+r.cp+r.d).indexOf(q)===-1) return false;
  return true;
}
const results = () => ROWS.filter(r => passes(r, null));

function counts(k){
  const m = new Map();
  ROWS.forEach(r => { if (passes(r,k)){ const v=val(r,k); if(v) m.set(v,(m.get(v)||0)+1); } });
  return m;
}

function optHTML(k, label, n, on, dis){
  return `<button class="opt" data-k="${k}" data-v="${esc(label)}" aria-pressed="${on}" ${dis?'disabled':''}>
    <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m20 6-11 11-5-5"/></svg></span>
    <span class="lbl">${esc(label)}</span><span class="n">${n}</span></button>`;
}

function renderFacets(){
  // marca de equipo
  let c = counts('mk');
  $('#f-mk').innerHTML = `<div class="opts">` +
    [...c.keys()].sort().map(v => optHTML('mk', v, c.get(v), F.mk.has(v), false)).join('') + `</div>`;
  // modelo de equipo
  c = counts('e');
  const eq = norm($('#eqsearch').value);
  const all = [...new Set(ROWS.map(r=>r.e))].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}))
    .filter(v => !eq || norm(v).indexOf(eq)>-1);
  $('#f-eq').innerHTML = all.map(v => optHTML('e', v, c.get(v)||0, F.e.has(v), !c.has(v) && !F.e.has(v))).join('')
    || `<p style="font-size:12.5px;color:var(--ink-3);margin:4px 2px">Sin modelos que coincidan.</p>`;
  // voltaje
  c = counts('v');
  const volts = [...new Set(ROWS.map(r=>String(r.v)).filter(Boolean))].sort((a,b)=>a-b);
  $('#f-v').innerHTML = volts.map(v =>
    `<button class="vchip" data-k="v" data-v="${esc(v)}" aria-pressed="${F.v.has(v)}" ${!c.has(v)&&!F.v.has(v)?'disabled':''}>${esc(v)}V <span class="n">${c.get(v)||0}</span></button>`).join('');
  // familia
  c = counts('f');
  const fams = [...new Set(ROWS.map(r=>r.f).filter(Boolean))].sort();
  $('#f-f').innerHTML = fams.map(v => optHTML('f', v, c.get(v)||0, F.f.has(v), !c.has(v) && !F.f.has(v))).join('');
  // marca de bateria
  c = counts('s');
  const brands = [...new Set(ROWS.map(r=>brandOf(r.s)))].sort();
  $('#f-s').innerHTML = brands.map(v => optHTML('s', v, c.get(v)||0, F.s.has(v), !c.has(v) && !F.s.has(v))).join('');

  const n = KEYS.reduce((a,k)=>a+F[k].size,0);
  const b = $('#fcount'); b.hidden = !n; b.textContent = n;
  const nres = ROWS.filter(r => passes(r,null)).length;
  $('#applyf').textContent = `Ver ${nres} ${nres===1?'batería':'baterías'}`;
}

function renderActive(){
  const tags = [];
  KEYS.forEach(k => F[k].forEach(v => tags.push(
    `<span class="tag">${LABEL[k]}: ${esc(v)}${k==='v'?'V':''}<button data-k="${k}" data-v="${esc(v)}" aria-label="Quitar">✕</button></span>`)));
  $('#active').innerHTML = tags.length
    ? `<span class="k">Filtros</span>` + tags.join('') + `<button class="clearall" id="clr">Limpiar todo</button>`
    : '';
}

function renderSpec(list){
  const eqs = [...new Set(list.map(r=>r.e))];
  if (eqs.length !== 1){ $('#spec').innerHTML=''; return; }
  const r = list[0];
  const bits = [['Compartimiento', r.cp], ['Conector', r.cn], ['Código comp.', r.cc],
                ['Posición', r.p], ['Largo cable', r.cb]].filter(x=>x[1]);
  $('#spec').innerHTML = `<div class="spec">
    <span class="nm">CROWN — ${esc(r.e)} <span style="color:var(--brand-ink)">(${esc(r.v)}V)</span></span>
    <span class="sp">${bits.map(x=>`<span><b>${x[0]}</b>${esc(x[1])}</span>`).join('')}</span></div>`;
}

function renderList(){
  const list = results();
  renderSpec(list);
  const withP = list.filter(r=>r.pr!=null).map(r=>r.pr);
  const best = withP.length ? Math.min(...withP) : null;
  $('#count').innerHTML = `<b>${list.length}</b> ${list.length===1?'batería':'baterías'}`
    + (withP.length ? ` · desde <b>${fmt(best)}</b>` : '');

  const s = $('#sort').value;
  let L = list.slice();
  if (s==='asc')  L.sort((a,b)=>(a.pr==null)-(b.pr==null)||a.pr-b.pr);
  if (s==='desc') L.sort((a,b)=>(a.pr==null)-(b.pr==null)||b.pr-a.pr);
  if (s==='ah')   L.sort((a,b)=>b._ah-a._ah);

  if (!L.length){
    $('#list').innerHTML = `<div class="empty"><strong>Sin resultados</strong>Quita algún filtro o busca otro modelo.</div>`;
    return;
  }
  const oneEq = new Set(list.map(r=>r.e)).size === 1;
  const head = `<div class="lhead">
    <span>Img</span><span>Producto</span><span>Voltaje</span><span>Capacidad</span>
    <span>Dimensiones</span><span class="num">Peso</span><span class="num">Precio</span></div>`;
  $('#list').innerHTML = head + L.map(r => {
    const price = r.pr==null
      ? `<span class="nop">Sin precio</span>`
      : `<span class="price${r.pr===best?' best':''}">${fmt(r.pr)}</span>`
        + (r.pr===best && L.length>1 ? '<br><span class="tagline">Más económica</span>' : '');
    return `<button class="card" data-i="${ROWS.indexOf(r)}">
      <span class="thumb">${esc(short(r.f))}</span>
      <span>
        <span class="fam">${esc(r.f)}</span>
        <span class="mdl">${esc(r.mm || r.m)}</span>
        <span class="meta">${esc(brandOf(r.s))}${!oneEq ? ' · '+esc(r.e) : ''}</span>
      </span>
      <span class="cel"><span class="mlabel">Voltaje</span>${esc(r.v)}V</span>
      <span class="cel"><span class="mlabel">Capacidad</span>${r._ah ? r._ah.toLocaleString('en-US')+' AH' : '—'}</span>
      <span class="cel"><span class="mlabel">Dimensiones</span>${esc(r.dm||'—')}</span>
      <span class="cel num"><span class="mlabel">Peso</span>${r.w ? esc(r.w)+' lb' : '—'}</span>
      <span class="pricewrap">${price}</span>
    </button>`;
  }).join('');
}

function render(){ renderFacets(); renderActive(); renderList(); }

// ---- detalle ----
const dlg = $('#dlg');
function detail(r){
  $('#d-fam').textContent = r.f || '—';
  $('#d-model').textContent = r.mm || r.m || '';
  $('#d-price').innerHTML = r.pr==null
    ? `<span style="font-size:15px;color:var(--warn);font-style:italic">Sin precio en los listados</span>`
    : fmt(r.pr) + ` <span style="font-size:12px;color:var(--ink-3);font-weight:500">USD</span>`;
  $('#d-eq').innerHTML = `CROWN ${esc(r.e)}<br>${esc(r.v)}V · ${esc(r.cn||'')}`;
  const f = [
    ['Modelo en hoja Crown', r.m], ['Código de orden', r.mo], ['Descripción', r.d],
    ['Volts / Amp', r.va], ['Dimensiones', r.dm], ['Peso', r.w?r.w+' lbs':''],
    ['KWH utilizable', r.kw], ['Garantía', r.wr], ['Conector batería', r.bc],
    ['Compartimiento equipo', r.cp], ['Posición / cable', [r.p,r.cb].filter(Boolean).join(' / ')]
  ].filter(x => x[1]!=='' && x[1]!=null);
  $('#d-list').innerHTML = f.map(x=>`<dt>${esc(x[0])}</dt><dd>${esc(x[1])}</dd>`).join('');
  $('#d-foot').textContent = r.s ? `Precio tomado de: ${r.s}${r.mt?'  ·  pareo por '+r.mt:''}` : 'Sin coincidencia en los listados maestros.';
  dlg.showModal();
}
$('#d-close').onclick = ()=>dlg.close();
dlg.addEventListener('click', e => { if (e.target===dlg) dlg.close(); });

// ---- eventos ----
function toggle(k,v){ F[k].has(v) ? F[k].delete(v) : F[k].add(v); render(); }
$('#side').addEventListener('click', e => {
  const b = e.target.closest('[data-k]'); if (!b || b.disabled) return;
  toggle(b.dataset.k, b.dataset.v);
});
$('#active').addEventListener('click', e => {
  if (e.target.id==='clr'){ KEYS.forEach(k=>F[k].clear()); render(); return; }
  const b = e.target.closest('button[data-k]'); if (b) toggle(b.dataset.k, b.dataset.v);
});
$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (c) detail(ROWS[+c.dataset.i]);
});
$('#q').addEventListener('input', render);
$('#eqsearch').addEventListener('input', renderFacets);
$('#sort').addEventListener('change', renderList);
const closeDrawer = ()=>document.body.classList.remove('drawer');
$('#openf').onclick = ()=>document.body.classList.add('drawer');
$('#closef').onclick = closeDrawer;
$('#applyf').onclick = closeDrawer;
$('#scrim').onclick = ()=>document.body.classList.remove('drawer');
document.addEventListener('keydown', e => { if (e.key==='Escape') document.body.classList.remove('drawer'); });

const JUNK=/^[\s xX\/.,\-]*$/;
function boot(){
  ROWS.forEach(r => {
    ['cp','cc','p','cb','d','va','dm','w','kw','wr','bc','mm','mo'].forEach(k=>{
      if (typeof r[k]==='string' && JUNK.test(r[k])) r[k]='';
    });
    r.mk = r.mk || 'CROWN'; r._ah = (()=>{ const t=r.va||'';
    let m=/(\d[\d,]*)\s*AH/i.exec(t); if(m) return +m[1].replace(/,/g,'');
    m=/\/\s*(\d[\d,]*)/.exec(t);      if(m) return +m[1].replace(/,/g,'');
    m=/^\s*(\d[\d,]*)\s*$/.exec(t);   if(m) return +m[1].replace(/,/g,'');
    return 0; })(); });
  render();
}
fetch('datos.csv', {cache:'no-store'})
  .then(r => r.ok ? r.text() : Promise.reject())
  .then(t => { const p = fromCSV(t); if (p && p.length) ROWS = p; })
  .catch(()=>{})
  .finally(boot);
})();

</script>
</body>
